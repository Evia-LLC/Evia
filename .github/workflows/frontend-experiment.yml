name: Frontend experiment verification

on:
  push:
    branches: [experiment/frontend-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check Svelte and accessibility diagnostics
        run: npm run check
      - name: Build preview application
        run: npm run build
      - name: Run unit tests
        run: npm run test:unit
