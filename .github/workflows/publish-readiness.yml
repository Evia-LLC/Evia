name: Verify published readiness repairs
on:
  push:
    branches: [ops/readiness-publish-20261014]
permissions:
  contents: read
concurrency:
  group: readiness-verification-20261014
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact published staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5c1de7216f420e1acebbd1e45fe75eef91884430
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both published branches and protected sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/staging | cut -f1)" = '5c1de7216f420e1acebbd1e45fe75eef91884430'
          test "$(git ls-remote origin refs/heads/experiment/frontend-rebuild | cut -f1)" = 'c1c9ae230083c9ea339dfad257a22dfab825b5cc'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '0880ba093cc6e3e421021b3046441ed3e3288fc8'
          protected=(shared src/styles src/legal src/pages/legal src/components/legal src/components/Nav.svelte src/components/Page.svelte src/pages/HomePage.svelte .github)
          git diff --exit-code 4dea94a19b698f48773e08a817396bb96913a797 5c1de7216f420e1acebbd1e45fe75eef91884430 -- "${protected[@]}"
          git diff --exit-code d72aeec1575d49ee6986b3767fa406b535612a0a c1c9ae230083c9ea339dfad257a22dfab825b5cc -- "${protected[@]}"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up pinned local Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.120.0
      - name: Real isolated Supabase Data API integration suite
        run: npm run test:data-api
