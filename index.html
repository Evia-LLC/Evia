<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="description" content="Elohim — a beauty consultant who can actually look at your skin. Scans run on your device; she reads, remembers and recommends." />
    <meta property="og:title" content="Elohim" />
    <meta property="og:description" content="A beauty consultant who can actually look at your skin." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Elohim</title>
    <!-- Her critical pieces, fetched alongside the bundle rather than after
         it: the room plate, the body she stands in, her head, the manifest
         that places them. This is most of the difference between the app
         appearing and the app loading. -->
    <link rel="preload" href="/backdrops/lounge.webp" as="image" type="image/webp" />
    <link rel="preload" href="/character/elohim/manifest.json" as="fetch" />
    <link rel="preload" href="/character/elohim/body-casual-rest.webp" as="image" type="image/webp" />
    <link rel="preload" href="/character/elohim/head.webp" as="image" type="image/webp" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
